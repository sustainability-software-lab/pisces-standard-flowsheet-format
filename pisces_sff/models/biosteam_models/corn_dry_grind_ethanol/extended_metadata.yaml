# extended_metadata.yaml -- human-authored descriptive metadata for this
# flowsheet. Read by pisces_sff._runner.load_extended_metadata and written into
# the exported SFF metadata block. Top-level keys map one-to-one onto exporter
# keyword arguments.
#
source_doi: "https://doi.org/10.1016/j.indcrop.2005.08.004"
#
# Note this particular model was not developed as part of the source_doi publication --
# it was built based faithfully on the design in that publication but not itself published.
#
process_title: "Corn → Ethanol + Crude oil + DDGS"
#
flowsheet_designers: "Yoel Cortes-Pena"
#
# A BioSTEAM System carries no explicit host identity, so the fermenting organism cannot
# be inferred and must be declared. The dry-grind process ferments via
# simultaneous saccharification and fermentation (biorefineries.corn.units.SSF):
# Glucose -> 2 Ethanol + 2 CO2 alongside a Yeast growth reaction -- one host.
microorganisms:
  - name: "Saccharomyces cerevisiae"
    label: "ethanologen"
