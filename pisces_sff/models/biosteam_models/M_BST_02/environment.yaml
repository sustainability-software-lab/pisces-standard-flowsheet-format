# Pinned environment for the corn -> 3-hydroxypropionic acid -> acrylic acid
# model (Bioindustrial-Park `biorefineries.HP`, separation process A, low-pH
# fermentation, `300L_FGI` parameter distributions).
#
# `pisces_sff.export_model` builds this environment and runs the export inside
# it, so these pins are what actually produced the exported flowsheet. They
# follow the reproduction instructions of the source publication
# (https://doi.org/10.1038/s41467-026-75285-1, Code availability; README of
# https://github.com/sarangbhagwat/fermentation_insights): Bioindustrial-Park
# at commit 49f2e618, biosteam at commit e2d3942, and the pins in
# biorefineries/HP/requirements.txt at that commit (thermosteam 0.42.2,
# numba 0.59.1, thermo 0.2.27, ...).
#
# Three things to know when reproducing this by hand:
#
#   1. Set PIP_NO_DEPS=1 before running `conda env create`. Bioindustrial-Park
#      declares `biosteam>=2.51.15`, which pip would otherwise honour by
#      replacing the pinned biosteam commit below with a newer PyPI build --
#      defeating the point of pinning. (`--no-deps` cannot be written into the
#      pip: block; pip's requirements-file parser rejects it as an unknown
#      option.)
#   2. Because dependency resolution is off, every transitive dependency is
#      listed explicitly below. Adding a package here is how a missing import
#      gets fixed -- there is no resolver to fall back on.
#   3. Bioindustrial-Park is installed *editable* (`-e git+...`): its setup.py
#      at this commit does not list `biorefineries/HP` in package_data, so a
#      regular install would omit the model. An editable install puts the
#      whole clone on the path -- the pip-native form of the publication's
#      "clone the repository and add it to PYTHONPATH" instruction. Set
#      PIP_SRC to keep the checkout out of this directory (the harness sets
#      it to <env prefix>/src).
#
#   PowerShell:  $env:PIP_NO_DEPS = "1"; conda env create -f environment.yaml
#   bash:        PIP_NO_DEPS=1 conda env create -f environment.yaml
#
# `name` is ignored by the harness, which creates the environment as
# sff-<first 12 hex chars of the environment key>, and is excluded from that
# key so renaming this field does not fork the environment.
name: sff-corn-3hp-acrylic-acid
channels:
  - defaults
dependencies:
  - python=3.9.25
  - pip
  - pip:
      # Simulator and flowsheet model, pinned to commits.
      - biosteam @ git+https://github.com/BioSTEAMDevelopmentGroup/biosteam@e2d3942dd1076a4516efc91ae194f9e558428551
      - -e git+https://github.com/BioSTEAMDevelopmentGroup/Bioindustrial-Park@49f2e618a81b2fc1a6aae14fdd588e838b1e777f#egg=biorefineries
      # Thermodynamics and property packages
      - thermosteam==0.42.2
      - chemicals==1.2.0
      - thermo==0.2.27
      - fluids==1.0.26
      - flexsolve==0.5.7
      - free-properties==0.3.6
      - colorpalette==0.3.3
      # Numerics
      - numpy==1.26.4
      - scipy==1.13.1
      - pandas==2.2.2
      - numba==0.59.1
      - llvmlite==0.42.0
      # Plotting, units, IO
      - matplotlib==3.5.2
      - contourplots==0.3.4   # imported at module level by the HP system modules
      - imageio==2.37.2       # contourplots
      - Pint==0.23
      - graphviz==0.20.3
      - xlrd==2.0.1
      - openpyxl==3.1.2
      - xlsxwriter==3.2.9
      # Used by the exporter and runner themselves
      - jsonschema==4.25.0
      - PyYAML==6.0.1
      # Declared by biosteam
      - ipython==8.15.0
      - chaospy==4.3.15
      # Declared by Bioindustrial-Park (SALib and seaborn are deliberately
      # excluded: BIP declares them, but neither is required to load and
      # simulate this model.)
      - scikit-learn==1.6.1
      # Transitive dependencies. Because dependency resolution is off
      # (PIP_NO_DEPS=1), every transitive requirement of the packages above must
      # be listed explicitly. Grouped by the direct dependency that pulls them in.
      - colorama==0.4.6      # colorpalette
      - ansicolors==1.1.8    # colorpalette (imports as `colors`)
      - pytz==2026.2         # pandas
      - python-dateutil==2.9.0.post0  # pandas, matplotlib
      - six==1.17.0          # python-dateutil
      - packaging==25.0      # matplotlib
      - pillow==11.3.0       # matplotlib (imports as `PIL`), imageio
      - pyparsing==3.3.2     # matplotlib
      - cycler==0.12.1       # matplotlib
      - kiwisolver==1.4.7    # matplotlib
      - et-xmlfile==2.0.0    # openpyxl
      - typing_extensions==4.15.0     # ipython, others
      - importlib_metadata==8.5.0     # backport used under Python 3.9
      - numpoly==1.3.4       # chaospy
      # ipython's own dependency tail
      - traitlets==5.14.3
      - prompt_toolkit==3.0.52
      - wcwidth==0.2.13      # prompt_toolkit
      - pygments==2.19.1
      - decorator==5.2.1
      - pickleshare==0.7.5
      - backcall==0.2.0
      - stack_data==0.6.3
      - executing==2.2.1     # stack_data
      - asttokens==3.0.0     # stack_data
      - pure_eval==0.2.3     # stack_data
      - exceptiongroup==1.3.0
      # jsonschema's own dependency tail (imported by pisces_sff._validate)
      - attrs==25.4.0
      - referencing==0.30.2
      - rpds-py==0.22.3      # attrs/referencing (imports as `rpds`)
      - jsonschema-specifications==2023.7.1
