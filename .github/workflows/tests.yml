name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Login shell so `conda activate` / `conda run` work the same on both
        # OSes; setup-miniconda populates CONDA_EXE and PATH in this shell,
        # which is what pisces_sff.export._harness.find_conda_exe relies on.
        shell: bash -el {0}
    env:
      # Single source for the env hash and the env build (Approach A).
      ENV_YAML: pisces_sff/export/models/biosteam_models/M_BST_01/environment.yaml
      # Workspace-relative cache dirs: identical path shape on Ubuntu and Windows.
      CONDA_PKGS_DIRS: ${{ github.workspace }}/.cache/conda-pkgs
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: false
          activate-environment: ""
          # Keep the base env minimal; the real env is built from ENV_YAML below.
          miniconda-version: latest

      - name: Restore conda package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CONDA_PKGS_DIRS }}
          key: conda-pkgs-${{ runner.os }}-${{ hashFiles('pisces_sff/export/models/biosteam_models/M_BST_01/environment.yaml') }}
          restore-keys: |
            conda-pkgs-${{ runner.os }}-

      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: pip-${{ runner.os }}-${{ hashFiles('pisces_sff/export/models/biosteam_models/M_BST_01/environment.yaml') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Report conda
        run: |
          conda --version
          echo "CONDA_EXE=$CONDA_EXE"

      - name: Compute harness environment name
        run: |
          # _harness.py imports PyYAML at module load. The step's `python` is
          # the runner's default interpreter (setup-miniconda does not activate
          # base here), which lacks PyYAML; modern conda ships ruamel.yaml, not
          # PyYAML, so base is not a reliable source either. Install it directly
          # into whichever python runs the heredoc below.
          python -m pip install --quiet --disable-pip-version-check pyyaml
          NAME=$(python - <<'PY'
          import importlib.util, pathlib
          harness_path = pathlib.Path("pisces_sff/export/_harness.py")
          spec = importlib.util.spec_from_file_location("_sff_harness", harness_path)
          harness = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(harness)
          env_text = pathlib.Path(
              "pisces_sff/export/models/biosteam_models/M_BST_01/environment.yaml"
          ).read_text(encoding="utf-8")
          print(harness.environment_name(env_text))
          PY
          )
          echo "Computed harness env name: $NAME"
          echo "SFF_ENV_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Enable git long paths (Windows)
        if: runner.os == 'Windows'
        run: |
          # environment.yaml pip-installs Bioindustrial-Park from git, and that
          # repo contains analysis-result files whose paths exceed Windows'
          # 260-char MAX_PATH, so the checkout inside `conda env create` fails
          # with "Filename too long" unless git long-path support is enabled.
          git config --system core.longpaths true

      - name: Create the pinned conda environment
        env:
          PIP_NO_DEPS: '1'
        run: |
          conda env create -n "$SFF_ENV_NAME" -f "$ENV_YAML"

      - name: Install pytest into the environment
        run: |
          conda run -n "$SFF_ENV_NAME" python -m pip install pytest

      - name: Install POSIX test dependency (Linux)
        if: runner.os == 'Linux'
        run: |
          # pexpect is a POSIX-only transitive dependency (via IPython) that
          # PIP_NO_DEPS=1 skips at env-create time; on Windows it is never
          # needed. Without it, every test that imports real biosteam errors
          # with ModuleNotFoundError: No module named 'pexpect'.
          conda run -n "$SFF_ENV_NAME" python -m pip install pexpect

      - name: Run the full test suite (all six tiers)
        run: |
          conda run --no-capture-output -n "$SFF_ENV_NAME" python -m pytest tests -q
